<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ProMarket | Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d5e3fd;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#0d1c2f",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#f8f9ff",
                        "surface-container-low": "#eff4ff",
                        "primary-fixed": "#dde1ff",
                        "outline-variant": "#c4c5d5",
                        "surface-tint": "#3755c3",
                        "surface-variant": "#d5e3fd",
                        "surface-container": "#e6eeff",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-fixed-dim": "#ffb59a",
                        "on-tertiary-fixed": "#380d00",
                        "on-surface-variant": "#444653",
                        "tertiary": "#611e00",
                        "on-secondary-container": "#54647a",
                        "inverse-on-surface": "#ebf1ff",
                        "inverse-primary": "#b8c4ff",
                        "tertiary-container": "#872d00",
                        "surface-container-high": "#dde9ff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "inverse-surface": "#233144",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#802a00",
                        "on-primary-fixed-variant": "#173bab",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "surface-dim": "#ccdbf4",
                        "on-tertiary-container": "#ffa583",
                        "surface-container-highest": "#d5e3fd",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdbce",
                        "on-surface": "#0d1c2f",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed": "#001453",
                        "secondary": "#505f76",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b8c4ff",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8f9ff",
                        "primary": "#00288e",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#1e40af",
                        "on-primary-container": "#a8b8ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "outline": "#757684"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-white">

<!-- Main Content Canvas -->
<main class="ml-64 min-h-screen">


<!-- Address & Location Section -->
<section class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start pt-10 border-t border-surface-container" id="location">
<div>
<h3 class="text-xl font-bold text-on-surface font-headline tracking-tight">Address &amp; Location</h3>
<p class="text-slate-500 text-sm mt-2 leading-relaxed">Manage your service delivery addresses and GPS tracking preferences for on-site services.</p>
</div>
<div class="lg:col-span-2 space-y-6">
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-[0px_12px_32px_rgba(13,28,47,0.04)]">
<div class="flex items-center justify-between mb-4">
<h4 class="text-sm font-bold text-on-surface">Saved Addresses</h4>
<button class="text-xs font-bold text-primary hover:underline">Add New</button>
</div>
<div class="space-y-3">
<div class="flex items-start gap-4 p-4 bg-surface-container-low rounded-xl border-l-4 border-primary">
<span class="material-symbols-outlined text-primary mt-1">home</span>
<div class="flex-grow">
<div class="flex items-center gap-2">
<p class="text-sm font-bold text-on-surface">Primary Residence</p>
<span class="text-[10px] bg-primary text-white px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Default</span>
</div>
<p class="text-xs text-slate-500 mt-1">12B Admiralty Way, Lekki Phase 1, Lagos, Nigeria</p>
</div>
<span class="material-symbols-outlined text-slate-400 cursor-pointer hover:text-error transition-colors">delete</span>
</div>
</div>
</div>
</div>
</section>

</main>
</body></html>
